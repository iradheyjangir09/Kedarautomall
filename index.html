<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="./images/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <title>Kedarautomall</title>
  </head>

  <body class="font-['Poppins'] bg-[#f8f8f8] pt-20">
    <header class="fixed top-0 left-0 w-full bg-[#f8f8f8] shadow-sm z-50">
      <nav
        class="max-w-7xl mx-auto h-20 px-4 sm:px-6 lg:px-8 flex items-center justify-between"
      >
        <a href="./index.html" class="shrink-0">
          <img
            src="./images/logo.png"
            alt="Kedarautomall Logo"
            class="w-[85px] sm:w-[100px]"
          />
        </a>

        <div class="hidden md:flex items-center gap-5 lg:gap-7">
          <a
            href="./index.html"
            class="text-sm lg:text-base font-medium hover:text-yellow-600 transition"
          >
            Home
          </a>

          <a
            href="./index.html"
            class="text-sm lg:text-base font-medium hover:text-yellow-600 transition"
          >
            Buy Vehicle
          </a>

          <a
            href="./index.html"
            class="text-sm lg:text-base font-medium hover:text-yellow-600 transition"
          >
            Sell Vehicle
          </a>

          <a
            href="./index.html"
            class="text-sm lg:text-base font-medium hover:text-yellow-600 transition"
          >
            Services
          </a>

          <a
            href="./index.html"
            class="text-sm lg:text-base font-medium hover:text-yellow-600 transition"
          >
            Contact
          </a>

          <a
            href="./index.html"
            class="text-sm lg:text-base font-medium hover:text-yellow-600 transition"
          >
            About
          </a>
        </div>

        <div class="flex items-center gap-4">
          <a
            href="./index.html"
            aria-label="Search"
            class="text-lg hover:text-yellow-600 transition"
          >
            <i class="fas fa-search"></i>
          </a>

          <a
            href="./index.html"
            aria-label="Account"
            class="text-lg hover:text-yellow-600 transition"
          >
            <i class="fas fa-user"></i>
          </a>

          <a
            href="./index.html"
            aria-label="Menu"
            class="md:hidden text-xl hover:text-yellow-600 transition"
          >
            <i class="fas fa-bars"></i>
          </a>
        </div>
      </nav>
    </header>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </body>
</html>
